<style>

:root[data-theme="dark"]{

@media (max-width:820px){.wide{grid-template-columns:1fr}.sumrow{grid-template-columns:1fr 1fr}.rights{grid-template-columns:1fr}}

</style>

const fmt=n=>{const s=Math.round(Math.abs(n)).toLocaleString("fr-FR").replace(/ | /g," ");return (n<0?"−":"")+s};
const fc=n=>fmt(n)+" FC";
const cdf=e=>e.devise==="USD"?e.montant*S.rate:e.montant;
const orig=e=>e.devise==="USD"?`${fmt(e.montant)} $ au taux ${fmt(S.rate)}`:"";
const ddmm=s=>{const [y,m,dd]=s.split("-");return `${dd}/${m}/${y}`};
const todayISO=()=>{const t=new Date();return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`};
const refDate=()=>{const t=todayISO();const last=S.entries.reduce((m,e)=>e.date>m?e.date:m,"");return t<`${YEAR}-12-31`&&t>=`${YEAR}-01-01`?t:last};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const accLabel=id=>ACCTS.find(a=>a.id===id)?.label||id;

function balances(upto){
  const b={...S.opening};delete b.stock;
  S.entries.filter(e=>!upto||e.date<=upto).forEach(e=>{const v=cdf(e);
    if(e.type==="recette")b[e.compte]+=v;else if(e.type==="depense")b[e.compte]-=v;else{b[e.compte]-=v;b[e.vers]+=v}});
  return b;
}
function mt(i){if(i.entryId){const e=S.entries.find(x=>x.id===i.entryId);if(e)return cdf(e)}return i.montant}
function amortYear(i){const y0=+i.date.slice(0,4);if(y0>YEAR)return 0;const used=YEAR-y0;return used<i.duree?mt(i)/i.duree:0}
function immoNet(i,endOfYear){const y0=+i.date.slice(0,4);const years=Math.min(i.duree,(endOfYear?YEAR:YEAR-1)-y0+1);return Math.max(0,mt(i)-mt(i)/i.duree*Math.max(0,years))}
function compute(){
  const yr=S.entries.filter(e=>e.date.startsWith(String(YEAR)));
  const sum=c=>yr.filter(e=>e.cat===c).reduce((s,e)=>s+cdf(e),0);
  const A1=sum("ventes"),A2=sum("autres_r"),A=A1+A2;
  const B={achats:sum("achats_m")+sum("achats_f"),loyers:sum("loyers"),salaires:sum("salaires"),impots:sum("impots"),interets:0,autres:sum("autres_d")};
  const Bt=Object.values(B).reduce((a,b)=>a+b,0);const C=A-Bt;
  const jan=`${YEAR}-01-01`,ref=refDate();
  const open=(L)=>L.filter(x=>x.date<jan&&(!x.paid||x.paid>=jan)).reduce((s,x)=>s+x.montant,0);
  const close=(L)=>L.filter(x=>!x.paid).reduce((s,x)=>s+x.montant,0);
  const CI=open(S.creances),CF=close(S.creances),DI=open(S.dettes),DF=close(S.dettes);
  const SI=S.opening.stock,SF=S.stockFinal;
  const D=(SI-SF)+(CI-CF),E=(DI-DF);
  const F=S.immos.reduce((s,i)=>s+amortYear(i),0);
  const G=C-D+E-F;
  const bal=balances();const caisse=bal.caisse,banque=bal.mpesa+bal.orange+bal.banque;
  const immosEnd=S.immos.reduce((s,i)=>s+immoNet(i,true),0),immosOpen=S.immos.filter(i=>+i.date.slice(0,4)<YEAR).reduce((s,i)=>s+immoNet(i,false),0);
  const cashOpen=S.opening.caisse+S.opening.mpesa+S.opening.orange+S.opening.banque;
  const apports=sum("apport"),prelev=sum("prelev");
  const CEopen=cashOpen+SI+CI+immosOpen-DI;const CE=CEopen+apports-prelev;
  const actif=immosEnd+SF+CF+caisse+banque,passif=CE+G+0+DF;
  return {A1,A2,A,B,Bt,C,SI,SF,CI,CF,DI,DF,D,E,F,G,caisse,banque,immosEnd,CE,CEopen,apports,prelev,actif,passif,bal};
}

function bindCom(){
  view.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();window.scrollTo(0,0)});
  view.querySelectorAll("[data-tab-go]").forEach(b=>b.onclick=()=>{tab=b.dataset.tabGo;render()});
  view.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{draft=null;scrSaisir();draft.type=b.dataset.go;draft.cat=b.dataset.go==="recette"?"ventes":"achats_m";tab="saisir";render()});
  view.querySelectorAll("[data-acct]").forEach(b=>b.onclick=()=>{jAcct=b.dataset.acct;jMonth=null;render()});
  const im=document.getElementById("i-mois");if(im)im.onchange=()=>{jMonth=im.value;render()};
  view.querySelectorAll("[data-tt]").forEach(b=>b.onclick=()=>{tiersTab=b.dataset.tt;render()});
  view.querySelectorAll("[data-etat]").forEach(b=>b.onclick=()=>{etat=b.dataset.etat;render()});
  const sf=document.getElementById("i-sf");if(sf)sf.onchange=()=>{const n=parseFloat(sf.value.replace(/\s/g,"").replace(",","."));if(!isNaN(n)&&n>=0){S.stockFinal=Math.round(n);save();render();toast("Stock final mis à jour")}};
  view.querySelectorAll("[data-pay]").forEach(b=>b.onclick=()=>{
    const id=+b.dataset.pay,L=tiersTab==="creances"?S.creances:S.dettes,x=L.find(y=>y.id===id),acc=document.getElementById("pay-"+id).value;
    const d=refDate();x.paid=d;x.compte=acc;
    S.entries.push({id:S.nextId++,date:d,type:tiersTab==="creances"?"recette":"depense",compte:acc,cat:tiersTab==="creances"?"ventes":(x.cat||"achats_m"),libelle:`${tiersTab==="creances"?"Encaissement":"Règlement"} facture ${x.facture||""}, ${x.nom}`,montant:x.montant,devise:"CDF",piece:true});
    save();render();toast(tiersTab==="creances"?"Encaissement enregistré":"Règlement enregistré")});
  const f=document.getElementById("f-saisie");if(!f)return;
  const sync=()=>{const g=id=>document.getElementById(id);
    if(g("i-montant"))draft.montant=g("i-montant").value;if(g("i-devise"))draft.devise=g("i-devise").value;
    if(g("i-compte"))draft.compte=g("i-compte").value;if(g("i-vers"))draft.vers=g("i-vers").value;if(g("i-cat"))draft.cat=g("i-cat").value;
    if(g("i-lib"))draft.libelle=g("i-lib").value;if(g("i-date"))draft.date=g("i-date").value;if(g("i-tiers"))draft.tiers=g("i-tiers").value;if(g("i-fact"))draft.facture=g("i-fact").value;
    if(g("i-credit"))draft.credit=g("i-credit").checked};
  f.querySelectorAll("[data-type]").forEach(b=>b.onclick=()=>{sync();draft.type=b.dataset.type;draft.cat=draft.type==="recette"?"ventes":draft.type==="depense"?"achats_m":"transfert";if(draft.type==="transfert")draft.credit=false;render()});
  ["i-credit","i-cat"].forEach(id=>{const el=document.getElementById(id);if(el)el.onchange=()=>{sync();render()}});
  f.querySelectorAll("input,select").forEach(el=>{el.addEventListener("input",()=>{const e=document.getElementById("e-"+(el.id==="i-montant"?"montant":el.id==="i-tiers"?"tiers":"vers"));if(e)e.hidden=true})});
  const pc=document.getElementById("i-piece");if(pc)pc.onchange=()=>{draft.piece=pc.files.length>0};
  f.onsubmit=ev=>{ev.preventDefault();sync();
    const n=parseFloat(String(draft.montant).replace(/\s/g,"").replace(",","."));let bad=false;
    if(!(n>0)){const e=document.getElementById("e-montant");e.textContent="Saisissez un montant supérieur à zéro.";e.hidden=false;bad=true}
    if(draft.type==="transfert"&&draft.compte===draft.vers){const e=document.getElementById("e-vers");e.textContent="Choisissez deux comptes différents.";e.hidden=false;bad=true}
    if(draft.credit&&!draft.tiers.trim()){const e=document.getElementById("e-tiers");e.textContent="Indiquez le nom du "+(draft.type==="recette"?"client.":"fournisseur.");e.hidden=false;bad=true}
    if(!draft.date||!draft.date.startsWith(String(YEAR))){toast("La date doit être dans l'exercice "+YEAR);bad=true}
    if(bad)return;
    const lib=draft.libelle.trim()||(draft.type==="transfert"?`Transfert ${accLabel(draft.compte)} vers ${accLabel(draft.vers)}`:CATS[draft.cat]);
    const amtCDF=draft.devise==="USD"?n*S.rate:n;
    if(draft.credit){const L=draft.type==="recette"?S.creances:S.dettes;L.push({id:S.nextId++,date:draft.date,facture:draft.facture.trim(),nom:draft.tiers.trim(),montant:Math.round(amtCDF),paid:null,compte:null,cat:draft.cat});
      tiersTab=draft.type==="recette"?"creances":"dettes";toast(draft.type==="recette"?"Créance enregistrée":"Dette enregistrée");draft=null;tab="tiers"}
    else{const eid=S.nextId++;S.entries.push({id:eid,date:draft.date,type:draft.type,compte:draft.compte,vers:draft.type==="transfert"?draft.vers:undefined,cat:draft.type==="transfert"?"transfert":draft.cat,libelle:lib,montant:n,devise:draft.devise,piece:draft.piece});
      if(draft.cat==="materiel"&&draft.type==="depense")S.immos.push({id:S.nextId++,date:draft.date,designation:lib,montant:Math.round(amtCDF),duree:5,auto:true,entryId:eid});
      jAcct=draft.compte;jMonth=draft.date.slice(0,7);toast("Enregistré dans le journal "+accLabel(draft.compte));draft=null;tab="journal"}
    save();render();window.scrollTo(0,0)};
}

/* ---------- espace assistant ---------- */
function anomalies(){
  const A=[];const ref=refDate();
  const sansPiece=S.entries.filter(e=>!e.piece&&e.date.startsWith(String(YEAR)));
  if(sansPiece.length)A.push({lvl:"warn",t:`${sansPiece.length} opération${sansPiece.length>1?"s":""} sans pièce justificative`,d:sansPiece.slice(-3).map(e=>`${ddmm(e.date)} · ${e.libelle}`).join(" ; ")});
  const days=new Set(S.entries.filter(e=>e.type==="recette"&&e.cat==="ventes").map(e=>e.date));
  let gap=0,c=new Date(ref);for(let i=0;i<10;i++){const s=c.toISOString().slice(0,10);if(days.has(s))break;if(c.getUTCDay()!==0)gap++;c.setDate(c.getDate()-1)}
  if(gap>=5)A.push({lvl:"warn",t:`${gap} jours ouvrés sans vente saisie`,d:"Les ventes sont saisies par semaine. Demander une saisie quotidienne de la caisse."});
  const b=balances();ACCTS.forEach(a=>{if(b[a.id]<0)A.push({lvl:"bad",t:`Solde négatif : ${a.label}`,d:`${fc(b[a.id])}. Une caisse ne peut pas être négative : opération oubliée ou erreur de compte.`})});
  const old=S.creances.filter(x=>!x.paid&&(new Date(ref)-new Date(x.date))/864e5>30);
  if(old.length)A.push({lvl:"bad",t:`${old.length} créance${old.length>1?"s":""} de plus de 30 jours`,d:old.map(x=>`${x.nom} (${fmt(x.montant)} FC)`).join(" ; ")});
  const usd=S.entries.filter(e=>e.devise==="USD").length;if(usd)A.push({lvl:"ok",t:`${usd} opérations en dollars converties au taux de ${fmt(S.rate)} FC`,d:"Taux à confirmer avec l'expert-comptable avant l'arrêté des états."});
  return A;
}

function clientState(c){

  ${rows.map(r=>`<tr class="clientline" tabindex="0" data-cl="${r.i}" aria-selected="${r.i===selClient}"><td><b style="font-weight:600">${esc(r.c.nom)}</b></td><td>${r.c.act}</td><td>${r.c.forf}</td><td class="num">${ddmm(r.st.last)}</td><td class="r num">${r.st.ca}</td><td>${status(r.st)}</td></tr>`).join("")}</tbody></table></div>

  ${sel.c.live?`<div class="tablewrap"><table><tbody><tr><td>Taux de conversion du dollar</td><td class="r"><input id="i-rate" inputmode="numeric" value="${S.rate}" aria-label="Taux du dollar" style="width:90px;text-align:right;font-family:var(--mono);border:1px solid var(--line-strong);border-radius:8px;padding:4px 6px;background:var(--surface)"> FC</td></tr><tr><td>Stock final déclaré</td><td class="r num">${fmt(S.stockFinal)}</td></tr><tr><td>Résultat provisoire</td><td class="r num">${fmt(compute().G)}</td></tr></tbody></table></div>
  <button class="btn" id="b-relance">Envoyer un rappel au commerçant</button><p class="hint" id="relance-out" hidden></p>`:""}
  </section></div>`;
  view.querySelectorAll("[data-cl]").forEach(t=>{const go=()=>{selClient=+t.dataset.cl;renderAss()};t.onclick=go;t.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go()}}});
  const rt=document.getElementById("i-rate");if(rt)rt.onchange=()=>{const n=parseFloat(rt.value.replace(/\s/g,"").replace(",","."));if(n>0){S.rate=Math.round(n);save();renderAss();toast("Taux mis à jour, états recalculés")}};
  const rl=document.getElementById("b-relance");if(rl)rl.onclick=()=>{const o=document.getElementById("relance-out");o.hidden=false;o.textContent="Rappel préparé pour WhatsApp : « Mbote Maman Nsimba, pensez à saisir la caisse de chaque jour et à photographier les factures sans pièce. Merci. » (simulation, aucun message n'est envoyé)"};
}
